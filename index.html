<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>QUANTUM SWARM: ETERNAL DYNASTY</title>
<style>
  :root{
    --bg:#000000;--text:#ffffff;--gold:#ffea00;--cyan:#00ffff;
    --magenta:#ff00ff;--lime:#b8ff00;--orange:#ff9b00;--red:#ff445e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 50%,#150025 0%,#030308 45%,#000 100%);font-family:'Orbitron',sans-serif;color:#fff;touch-action:none;overscroll-behavior:none;-webkit-text-size-adjust:100%;}
  #app{position:fixed;inset:0;overflow:hidden;touch-action:none;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;filter:contrast(1.18) saturate(1.45) brightness(1.03);touch-action:none;}
  .hud{position:absolute;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));display:flex;justify-content:space-between;gap:10px;pointer-events:none;z-index:5;}
  .card{min-width:0;flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-left:4px solid var(--cyan);backdrop-filter:blur(18px);padding:10px 14px;box-shadow:0 0 28px rgba(0,255,255,.16);border-radius:16px;}
  .label{font-size:11px;letter-spacing:.22em;color:var(--cyan);font-weight:700;opacity:.95;}
  .value{font-size:clamp(20px,5vw,32px);font-weight:900;text-shadow:0 0 15px var(--cyan);line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sub{font-size:11px;letter-spacing:.14em;color:rgba(255,255,255,.72);margin-top:4px;}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.78);backdrop-filter:blur(10px);z-index:100;padding:24px;}
  .panel{text-align:center;max-width:620px;width:min(92vw,620px);border:2px solid var(--cyan);border-radius:24px;padding:34px 22px;box-shadow:0 0 100px rgba(0,255,255,.25),inset 0 0 30px rgba(255,255,255,.04);background:linear-gradient(180deg,rgba(0,255,255,.08),rgba(255,0,255,.06));}
  h1{font-size:clamp(2.2rem,10vw,4rem);margin:0;letter-spacing:6px;text-shadow:0 0 30px var(--cyan);line-height:1.05;}
  .lead{letter-spacing:1.2px;margin:16px 0 0;color:rgba(255,255,255,.84);font-size:14px;line-height:1.7;}
  button{background:linear-gradient(90deg,var(--cyan),#9bf7ff);border:none;padding:16px 42px;font-size:22px;font-weight:900;cursor:pointer;margin-top:26px;border-radius:999px;box-shadow:0 0 30px rgba(0,255,255,.65);transition:transform .15s,filter .15s;}
  button:active{transform:scale(.98)}
  .fever-ui{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(86vw,760px);height:14px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden;box-shadow:0 0 24px rgba(255,0,255,.25);z-index:4;}
  #energyBar{height:100%;width:0%;background:linear-gradient(90deg,var(--cyan),var(--magenta),var(--gold));box-shadow:0 0 20px var(--magenta);}
  .hint{position:absolute;left:50%;bottom:calc(42px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:12px;letter-spacing:.1em;color:rgba(255,255,255,.78);background:rgba(0,0,0,.34);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:8px 14px;backdrop-filter:blur(10px);z-index:4;pointer-events:none;white-space:nowrap;}
  .toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-weight:900;font-size:clamp(20px,5vw,40px);letter-spacing:.16em;text-shadow:0 0 18px currentColor,0 0 35px currentColor;pointer-events:none;opacity:0;z-index:6;}
  .color-badge{position:absolute;right:12px;bottom:calc(72px + env(safe-area-inset-bottom));padding:10px 14px;border-radius:999px;font-size:12px;letter-spacing:.15em;font-weight:900;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(12px);z-index:4;pointer-events:none;}
  .badge-blue{color:var(--cyan);box-shadow:0 0 20px rgba(0,255,255,.25)}
  .badge-pink{color:var(--magenta);box-shadow:0 0 20px rgba(255,0,255,.25)}
  .color-controls{position:absolute;right:12px;bottom:calc(68px + env(safe-area-inset-bottom));display:flex;flex-direction:row;gap:8px;z-index:7;pointer-events:none;width:200px;}
  .color-btn{pointer-events:auto;flex:1;border:2px solid rgba(255,255,255,.22);background:rgba(0,0,0,.52);backdrop-filter:blur(12px);border-radius:20px;padding:16px 6px;font:900 15px/1 Orbitron,sans-serif;letter-spacing:.04em;color:#fff;box-shadow:0 0 18px rgba(255,255,255,.08);touch-action:manipulation;height:96px;}
  .color-btn.blue{color:var(--cyan);border-color:rgba(0,255,255,.4);box-shadow:0 0 22px rgba(0,255,255,.28);}
  .color-btn.pink{color:var(--magenta);border-color:rgba(255,0,255,.4);box-shadow:0 0 22px rgba(255,0,255,.28);}
  .color-btn.active{filter:brightness(1.25);border-width:3px;}
  .color-btn:active{transform:scale(.95);}
  .fire-controls{position:absolute;left:12px;bottom:calc(68px + env(safe-area-inset-bottom));z-index:7;pointer-events:none;width:150px;}
  .fire-btn{pointer-events:auto;width:100%;height:96px;border:2px solid rgba(255,255,255,.28);background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.07));backdrop-filter:blur(12px);border-radius:26px;padding:0 12px;font:900 20px/1 Orbitron,sans-serif;letter-spacing:.1em;color:#fff;box-shadow:0 0 28px rgba(255,255,255,.16);touch-action:none;user-select:none;-webkit-user-select:none;}
  .fire-btn.firing{transform:scale(.96);filter:brightness(1.25);box-shadow:0 0 36px rgba(255,255,255,.32);}
  #errorOverlay{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(180,0,0,.92);color:#fff;font:700 11px/1.4 monospace;padding:10px 14px;z-index:9999;word-break:break-all;max-height:40vh;overflow-y:auto;}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div class="hud">
    <div class="card"><div class="label">SCORE</div><div class="value" id="score">0</div><div class="sub" id="waveText">WAVE 1</div></div>
    <div class="card"><div class="label">COMBO</div><div class="value" id="combo">0</div><div class="sub" id="feverText">FEVER 0%</div></div>
  </div>
  <div class="toast" id="toast"></div>
  <div class="color-badge badge-blue" id="colorBadge">いまの色 青</div>
  <div class="fire-controls">
    <button class="fire-btn" id="fireBtn" type="button">撃つ</button>
  </div>
  <div class="color-controls">
    <button class="color-btn blue active" id="blueBtn" type="button">🔵 青</button>
    <button class="color-btn pink" id="pinkBtn" type="button">🔴 ピンク</button>
  </div>
  <div class="hint" id="hint">左の撃つを長押し　右の青とピンクで色チェンジ　ダブルタップでドカン　弾は撃ち消せる</div>
  <div class="fever-ui"><div id="energyBar"></div></div>
  <div id="errorOverlay"></div>
  <div class="overlay" id="titleScreen">
    <div class="panel">
      <h1 id="mainTitle">QUANTUM<br>SWARM</h1>
      <p id="subTitle" style="letter-spacing:2px;margin:18px 0 0;">ETERNAL DYNASTY EDITION</p>
      <p class="lead" id="leadText">上から来る敵を、下の砲台でぶち抜くだけ。<br>左の撃つを長押し。青い敵は青、ピンクの敵はピンク。<br>右の色ボタンで切り替え、ダブルタップでまとめてドカン。ボス弾は同じ色で撃ち消せる。</p>
      <button id="startBtn">ENGAGE</button>
    </div>
  </div>
</div>
<script>
(() => {
// ★ グローバルエラーハンドラ — エラー発生箇所を画面に表示
const errorOverlay = document.getElementById('errorOverlay');
window.onerror = function(msg, src, line, col, err) {
  const where = src ? src.split('/').pop() : '?';
  errorOverlay.style.display = 'block';
  errorOverlay.innerHTML += `<div>⚠ ${msg}<br>→ ${where} 行${line} 列${col}</div>`;
  return false;
};
window.addEventListener('unhandledrejection', e => {
  errorOverlay.style.display = 'block';
  errorOverlay.innerHTML += `<div>⚠ Promise: ${e.reason}</div>`;
});

const canvas=document.getElementById('cv');
const ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score');
const comboEl=document.getElementById('combo');
const waveText=document.getElementById('waveText');
const feverText=document.getElementById('feverText');
const energyBar=document.getElementById('energyBar');
const titleScreen=document.getElementById('titleScreen');
const startBtn=document.getElementById('startBtn');
const mainTitle=document.getElementById('mainTitle');
const subTitle=document.getElementById('subTitle');
const leadText=document.getElementById('leadText');
const toastEl=document.getElementById('toast');
const hintEl=document.getElementById('hint');
const colorBadge=document.getElementById('colorBadge');
const blueBtn=document.getElementById('blueBtn');
const pinkBtn=document.getElementById('pinkBtn');
const fireBtn=document.getElementById('fireBtn');

const COLORS=['#00ffff','#ff00ff'];
const COLOR_NAMES=['青','ピンク'];
const MAX_ENERGY=100;
const LANES=5;
const BOSS_TYPES=['SPREADER','LASER','SWARM_QUEEN','BOUNCER','PHASE_SHIFT'];
const PRAISE_POOL=['good！','super','nice','Amazing!','Brilliant','Genius','Flawless','Slay','Stunning'];
const RANK_TABLE=[[0,'D'],[5,'C'],[15,'B'],[30,'A'],[60,'S'],[100,'SS']];

function safeGetLocal(k,fb=''){try{const v=localStorage.getItem(k);return v==null?fb:v;}catch(_){return fb;}}
function safeSetLocal(k,v){try{localStorage.setItem(k,v);}catch(_){}}

let highScore=parseInt(safeGetLocal('qs_hi','0')||'0',10);
if(!Number.isFinite(highScore))highScore=0;

let audioCtx=null;
let audioNodeCount=0;
const AUDIO_NODE_LIMIT=10;
let w=0,h=0,dpr=Math.max(1,window.devicePixelRatio||1);
let game=null;

function getAudioCtx(){
if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
if(audioCtx.state==='suspended')audioCtx.resume();
return audioCtx;
}
function playSound(freq,type='sine',dur=0.1,vol=0.1,sweep=0.6){
if(audioNodeCount>=AUDIO_NODE_LIMIT)return;
try{
const ac=getAudioCtx();
const osc=ac.createOscillator(),gain=ac.createGain();
osc.type=type;
osc.frequency.setValueAtTime(Math.max(50,freq),ac.currentTime);
osc.frequency.exponentialRampToValueAtTime(Math.max(18,freq*sweep),ac.currentTime+dur);
 gain.gain.setValueAtTime(vol,ac.currentTime);
 gain.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+dur);
 osc.connect(gain);gain.connect(ac.destination);
 audioNodeCount++;
 osc.onended=()=>{audioNodeCount=Math.max(0,audioNodeCount-1);};
 osc.start();osc.stop(ac.currentTime+dur);
}catch(_){audioNodeCount=Math.max(0,audioNodeCount-1);}
}
function playKillSound(isBoss,isGiant,combo){
const boost=Math.min(combo*12,320);
if(isBoss){playSound(180+boost*.25,'sawtooth',.18,.08,.35);playSound(420+boost*.6,'triangle',.12,.05,.75);return;}
if(isGiant){playSound(240+boost,'square',.18,.06,.42);playSound(120+boost*.5,'sawtooth',.14,.04,.35);}
else{playSound(620+boost,'sine',.08,.05,.72);if(combo>=10)playSound((620+boost)*1.45,'triangle',.06,.025,.86);}
}
function playFeverSound(){
[160,220,320,480,720].forEach((f,i)=>setTimeout(()=>playSound(f,'sawtooth',.18,.045,.55),i*36));
setTimeout(()=>playSound(980,'square',.3,.05,.85),180);
}
function roundRectPath(c,x,y,W,H,r){
r=Math.min(r,W/2,H/2);
c.beginPath();c.moveTo(x+r,y);c.arcTo(x+W,y,x+W,y+H,r);c.arcTo(x+W,y+H,x,y+H,r);c.arcTo(x,y+H,x,y,r);c.arcTo(x,y,x+W,y,r);c.closePath();
}
function hexToRgba(hex,a){
return`rgba(${parseInt(hex.slice(1,3),16)},${parseInt(hex.slice(3,5),16)},${parseInt(hex.slice(5,7),16)},${a})`;
}
function laneX(i){const m=Math.max(42,w*.08);return m+(w-m*2)/(LANES-1)*i;}
function getViewportOffset(){return (window.visualViewport)?Math.max(0,window.innerHeight-window.visualViewport.height):0;}

function resize(){
dpr=Math.max(1,window.devicePixelRatio||1);w=window.innerWidth;h=window.innerHeight;
canvas.width=Math.floor(w*dpr);canvas.height=Math.floor(h*dpr);
ctx.setTransform(dpr,0,0,dpr,0,0);
if(game)updateBasePosition();
}
window.addEventListener('resize',resize,{passive:true});
if(window.visualViewport){
window.visualViewport.addEventListener('resize',resize,{passive:true});
window.visualViewport.addEventListener('scroll',resize,{passive:true});
}

function makeGame(){
return{
state:'title',score:0,combo:0,energy:0,wave:1,lives:3,phase:0,
shock:0,flash:0,flashColor:'#ffffff',toast:0,toastColor:'#ffffff',
enemies:[],enemyBullets:[],bullets:[],particles:[],lightBursts:[],stars:[],
hitStopTimer:0,zoomPunch:0,screenZoom:1,feverFlash:0,feverActivated:false,
pAngle:-Math.PI/2,pointerDown:false,holdDelay:.07,holdArmed:false,
autoFire:0,fireInterval:.082,pulseCooldown:0,comboTimer:0,time:0,
centerRadius:28,recoil:0,baseX:0,baseY:0,
activePointerId:null,fireTouchId:null,fireTouchActive:false,lastTapAt:0,
rank:'D',rankTimer:0,vignette:0,
boss:null,bossWarning:0,bossType:'',
waveEnemiesLeft:12,newRecord:false,newRecordShown:false,newRecordFlash:0,
spawnTimer:1.0,inputLockTimer:0,bossesDefeated:0,
};
}
function initStars(){
game.stars=[];
for(let i=0;i<80;i++)game.stars.push({x:Math.random()*w,y:Math.random()*h,z:Math.random()+.2,r:Math.random()*2+.5});
}
function updateBasePosition(){
const vv=getViewportOffset();game.baseX=w/2;game.baseY=h-108-vv;game.centerRadius=28;
}
function calcRank(combo){let r='D';for(const[th,n]of RANK_TABLE)if(combo>=th)r=n;return r;}
function saveHighScore(){
if(game.score<=highScore)return;
highScore=game.score;safeSetLocal('qs_hi',String(highScore));
if(!game.newRecordShown){
game.newRecord=true;game.newRecordShown=true;game.newRecordFlash=1;
game.flash=Math.max(game.flash,.45);game.flashColor='#ffffff';
showToast('NEW RECORD','#ffffff');
playSound(640,'triangle',.14,.06,.9);
setTimeout(()=>playSound(980,'square',.24,.05,.8),80);
}
}
function resetGame(){
game=makeGame();game.state='play';audioNodeCount=0;
updateBasePosition();initStars();updatePhaseText();updateHud();
mainTitle.innerHTML='QUANTUM<br>SWARM';
subTitle.textContent=`BEST ${highScore.toLocaleString()}`;
leadText.innerHTML='中央の撃つを長押し。左右の青とピンクで色チェンジ。ダブルタップでドカン。<br>波を抜け、ボスを倒し、記録を更新する。';
startBtn.textContent='ENGAGE';titleScreen.style.display='none';
stopFireInput();
}
function updatePhaseText(){
colorBadge.textContent=`いまの色 ${COLOR_NAMES[game.phase]}`;
colorBadge.className=`color-badge ${game.phase===0?'badge-blue':'badge-pink'}`;
hintEl.textContent=game.phase===0?'左の撃つを長押し　青い敵を撃て　右のピンクで切り替え　ダブルタップでドカン':'左の撃つを長押し　ピンクの敵を撃て　右の青で切り替え　ダブルタップでドカン';
blueBtn.classList.toggle('active',game.phase===0);pinkBtn.classList.toggle('active',game.phase===1);
}
function setPhase(phase){
if(game.state!=='play'||game.inputLockTimer>0)return false;
if(game.phase===phase)return false;
game.phase=phase;updatePhaseText();
game.flash=Math.max(game.flash,.18);game.flashColor=COLORS[game.phase];
playSound(game.phase===0?740:520,'triangle',.11,.05,.8);return true;
}
function showToast(text,color='#fff'){toastEl.textContent=text;toastEl.style.color=color;game.toast=1;game.toastColor=color;}
function spawnLightBurst(x,y,color,count=6){
for(let i=0;i<count;i++){
const ang=Math.random()*Math.PI*2;
game.lightBursts.push({x,y,angle:ang,len:0,maxLen:Math.max(w,h)*(.6+Math.random()*.6),speed:2200+Math.random()*800,color,width:1.5+Math.random()*3,life:1});
}
}
// ★ spawnExplosion: playSound完全削除、粒子数を最大18個に制限
function spawnExplosion(x,y,color,count=24,power=1){
const amount=Math.min(18,Math.round(count*.3+power*2.5));
for(let i=0;i<amount;i++){
const ang=Math.random()*Math.PI*2,spd=(Math.random()*4+1.2)*power;
game.particles.push({x,y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,life:1,color,size:Math.random()*6+3,spin:(Math.random()-.5)*.4,rot:Math.random()*Math.PI*2,friction:.93});
}
game.shock=Math.min(18,game.shock+5*power);
game.flash=Math.max(game.flash,.1*power);game.flashColor=color;
}
function showFloatingText(x,y,text,color,scale=1){
game.particles.push({text,x,y,vx:(Math.random()-.5)*1.1,vy:-1.2-Math.random()*.8,life:1,color,size:18*scale,textMode:true});
}
function addScore(base,x,y,color){
const gain=Math.round(base*(1+(game.wave-1)*.16)*(1+Math.min(30,game.combo)*.22)*(game.energy>=100?3:1)+Math.pow(Math.max(1,game.combo+1),1.2)*70);
game.score+=gain;
showFloatingText(x,y,`+${gain.toLocaleString()}`,color,1+Math.min(1.7,game.combo*.05));
return gain;
}
function triggerHitStop(dur){game.hitStopTimer=Math.max(game.hitStopTimer,dur);}
function triggerZoomPunch(s){game.zoomPunch=Math.max(game.zoomPunch,s);}
function triggerQuantumDecay(x,y,sourceId=''){
const visited=new Set(sourceId?[sourceId]:[]);let chain=0;
for(let i=game.enemies.length-1;i>=0;i--){
const e=game.enemies[i];if(!e||visited.has(e.id))continue;
if(Math.hypot(e.x-x,e.y-y)<=82){
visited.add(e.id);e.hitFlash=1;e.scaleJolt=1.15;
spawnExplosion(e.x,e.y,e.color,14,.7);spawnLightBurst(e.x,e.y,e.color,2);
showFloatingText(e.x,e.y,'CHAIN','#ffffff',.75);
addScore(Math.round(e.scoreBase*.3),e.x,e.y,'#ffffff');
game.combo+=1;game.comboTimer=Math.max(game.comboTimer,1.2);game.energy=Math.min(MAX_ENERGY,game.energy+1);
game.enemies.splice(i,1);chain++;if(chain>=6)break;
}
}
if(chain>=2){showToast('QUANTUM DECAY','#ffffff');triggerHitStop(.04);triggerZoomPunch(.018);}
}
function createEnemy(lane=null,yOffset=null,forcedKind=null){
const tierRoll=Math.random();
let kind=forcedKind||'round',size=18,speed=95+game.wave*6+game.bossesDefeated*4,hp=1,scoreBase=1300;
if(!forcedKind){
if(tierRoll>.9)kind='brute';
else if(tierRoll>.65)kind=Math.random()>.5?'star':'saucer';
else kind=Math.random()>.5?'round':'diamond';
}
if(kind==='brute'){size=30+Math.random()*10;speed=70+game.wave*4+game.bossesDefeated*3;hp=3+Math.floor(game.bossesDefeated/3);scoreBase=7000;}
else if(kind==='star'||kind==='saucer'){size=22+Math.random()*8;speed=108+game.wave*7+game.bossesDefeated*5;hp=2;scoreBase=2800;}
const colorIndex=Math.random()>.5?0:1;
const laneIndex=lane==null?Math.floor(Math.random()*LANES):Math.max(0,Math.min(LANES-1,lane));
return{x:laneX(laneIndex)+(Math.random()-.5)*16,y:yOffset==null?-60-size-Math.random()*120:yOffset,laneIndex,id:Math.random().toString(36).slice(2),colorIndex,color:COLORS[colorIndex],hp,maxHp:hp,size,kind,speed,wobble:Math.random()*Math.PI*2,spin:(Math.random()-.5)*1.2,rot:Math.random()*Math.PI*2,scoreBase,sway:kind==='saucer'?28:kind==='star'?18:10,fallAccel:1+Math.random()*.25,hitFlash:0,scaleJolt:1};
}
function spawnWaveChunk(){
if(game.boss||game.waveEnemiesLeft<=0)return;
const f=Math.random();
if(f<.25){const center=1+Math.floor(Math.random()*3),y=-60-Math.random()*60;for(let i=center-1;i<=center+1;i++)game.enemies.push(createEnemy(i,y-Math.random()*10,Math.random()>.65?'diamond':'round'));game.waveEnemiesLeft=Math.max(0,game.waveEnemiesLeft-3);}
else if(f<.33){game.enemies.push(createEnemy(Math.floor(Math.random()*LANES),-80,'brute'));game.waveEnemiesLeft=Math.max(0,game.waveEnemiesLeft-2);}
else{game.enemies.push(createEnemy());game.waveEnemiesLeft=Math.max(0,game.waveEnemiesLeft-1);}
}
function spawnEnemyBullet(x,y,angle,spd,colorIndex,size=9,bounce=false){
game.enemyBullets.push({x,y,vx:Math.cos(angle)*spd,vy:Math.sin(angle)*spd,colorIndex,color:COLORS[colorIndex],size,life:1,bounce});
}
function lineCircleHit(x1,y1,x2,y2,cx,cy,cr){
const dx=x2-x1,dy=y2-y1,len2=dx*dx+dy*dy;
if(len2<=.0001)return Math.hypot(cx-x1,cy-y1)<=cr;
const t=Math.max(0,Math.min(1,((cx-x1)*dx+(cy-y1)*dy)/len2));
return Math.hypot(cx-x1-dx*t,cy-y1-dy*t)<=cr;
}
function spawnBoss(){
const bossType=BOSS_TYPES[(game.wave-1)%BOSS_TYPES.length];

case'SWARM_QUEEN':

}
function updateEnemyBullets(dt){
for(let i=game.enemyBullets.length-1;i>=0;i--){
const b=game.enemyBullets[i];b.x+=b.vx;b.y+=b.vy;b.life-=dt*.3;
if(b.bounce){if(b.x<b.size){b.x=b.size;b.vx=Math.abs(b.vx);}if(b.x>w-b.size){b.x=w-b.size;b.vx=-Math.abs(b.vx);}}
if(b.y>h+40||b.life<=0||b.x<-60||b.x>w+60){game.enemyBullets.splice(i,1);continue;}
let erased=false;
for(let j=game.bullets.length-1;j>=0;j--){
const pb=game.bullets[j];
if(Math.hypot(pb.x-b.x,pb.y-b.y)<pb.size+b.size+2){
game.bullets.splice(j,1);game.enemyBullets.splice(i,1);erased=true;
const good=pb.colorIndex===b.colorIndex;spawnExplosion(b.x,b.y,good?pb.color:'#ffffff',good?10:6,good?0.65:0.4);
if(good){game.combo+=.35;game.comboTimer=Math.max(game.comboTimer,1.0);game.energy=Math.min(MAX_ENERGY,game.energy+1.5);addScore(260,b.x,b.y,'#ffea00');showFloatingText(b.x,b.y,'迎撃!','#ffea00',.8);playSound(520,'triangle',.04,.025,.8);}
else{showFloatingText(b.x,b.y,'相殺','#ffffff',.7);playSound(260,'square',.03,.02,.7);}break;
}
}
if(erased)continue;
if(Math.hypot(b.x-game.baseX,b.y-game.baseY)<game.centerRadius+b.size){
game.enemyBullets.splice(i,1);spawnExplosion(game.baseX,game.baseY,b.color,18,.7);
game.combo=0;game.energy=Math.max(0,game.energy-10);game.lives--;game.flash=Math.max(game.flash,.3);game.flashColor='#ff445e';
showToast('いたい','#ff445e');playSound(95,'square',.2,.06,.4);if(game.lives<=0){gameOver();return;}
}
}
}
function fireBullet(power=1){
const barrel=52,spd=17+power*1.8;game.recoil=Math.min(1,game.recoil+.42+power*.08);
const angle=game.pAngle+(Math.random()-0.5)*(game.energy>=100?0.08:0.03);
const bx=game.baseX+Math.cos(angle)*barrel,by=game.baseY+Math.sin(angle)*barrel;
game.bullets.push({x:bx,y:by,vx:Math.cos(angle)*spd,vy:Math.sin(angle)*spd,colorIndex:game.phase,color:COLORS[game.phase],size:8+power,life:1,power,trail:[{x:bx,y:by}]});
for(let i=0;i<3;i++){const a=angle+(Math.random()-.5)*.4,s=1.5+Math.random()*2;game.particles.push({x:bx,y:by,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.4,color:COLORS[game.phase],size:Math.random()*4+2,rot:0,spin:0,friction:.9});}
playSound(game.phase===0?540:420,'triangle',.06,.03+Math.min(.03,power*.01),.6);
}
function firePulse(){
if(game.inputLockTimer>0||game.energy<100||game.pulseCooldown>0)return;
game.energy=0;game.pulseCooldown=.7;game.feverFlash=1.0;game.flash=.6;game.flashColor='#ffffff';game.shock=22;
triggerHitStop(.12);triggerZoomPunch(.045);playFeverSound();
let hitCount=0,bulletClear=0;
for(let i=game.enemyBullets.length-1;i>=0;i--){const eb=game.enemyBullets[i];if(Math.hypot(eb.x-game.baseX,eb.y-game.baseY)<Math.min(w,h)*.78){bulletClear++;spawnExplosion(eb.x,eb.y,eb.color,10,.55);game.enemyBullets.splice(i,1);}}
if(game.boss&&game.boss.type==='LASER'&&(game.boss.phase===1||game.boss.phase===2)){game.boss.phase=0;game.boss.chargeTimer=0;game.boss.laserActive=0;game.boss.stateTimer=1.2;game.boss.stunTimer=.8;game.boss.interruptHp=8+game.wave;showToast('OVERDRIVE BREAK!!','#ffea00');spawnLightBurst(game.boss.x,game.boss.y,'#ffea00',10);}

if(game.boss){const boss=game.boss;if(Math.hypot(boss.x-game.baseX,boss.y-game.baseY)<Math.min(w,h)*.72){if(boss.colorIndex===game.phase){hitCount+=4;boss.hp-=8;boss.hitFlash=1;boss.scaleJolt=1.18;spawnExplosion(boss.x,boss.y,'#ffea00',28,1.3);spawnLightBurst(boss.x,boss.y,'#ffea00',8);if(boss.hp<=0)killBoss();}else showFloatingText(boss.x,boss.y,'REFLECT!','#ffffff',.9);}}
if(bulletClear>0){addScore(bulletClear*180,game.baseX,game.baseY-90,'#ffea00');showFloatingText(game.baseX,game.baseY-56,`迎撃 ${bulletClear}`,'#ffea00',.95);}
if(hitCount>0){game.combo+=hitCount;game.comboTimer=2.2;showToast(hitCount>=10?'MEGA ドカン!!':'ドカン!!','#ffea00');}
else{showToast('空ドカン','#ffffff');playSound(200,'triangle',.15,.04,.5);}
}
function pickTarget(){
let target=null,best=Infinity;
const candidates=game.boss?[game.boss,...game.enemies]:game.enemies;
if(!candidates.length)return null;
for(const e of candidates){
const dist=Math.hypot(e.x-game.baseX,e.y-game.baseY);
// Y位置が低い（自機に近い）ほど強く優先。距離も考慮
const d=dist - (e.y/h)*120;
if(d<best){best=d;target=e;}
}
return target;
}

function update(dt){
// ★ inputLockTimerは常に減算（hitStop中でも）
if(game.inputLockTimer>0)game.inputLockTimer=Math.max(0,game.inputLockTimer-dt);

if(game.hitStopTimer>0){
game.hitStopTimer-=dt;
if(game.flash>.01)game.flash*=.85;else game.flash=0;
if(game.feverFlash>.01)game.feverFlash*=.88;else game.feverFlash=0;
if(game.newRecordFlash>.01)game.newRecordFlash*=.95;else game.newRecordFlash=0;
// ★ hitStop中もparticles上限を適用（蓄積防止）
if(game.particles.length>120)game.particles.length=120;

}

game.time+=dt;
if(game.zoomPunch>.0005){game.zoomPunch*=.82;game.screenZoom=1+game.zoomPunch;}else{game.zoomPunch=0;game.screenZoom=1;}
if(game.energy>=100&&!game.feverActivated){game.feverActivated=true;game.feverFlash=.9;triggerHitStop(.08);triggerZoomPunch(.03);}
else if(game.energy<100)game.feverActivated=false;

if(target){let diff=Math.atan2(target.y-game.baseY,target.x-game.baseX)-game.pAngle;while(diff>Math.PI)diff-=Math.PI*2;while(diff<-Math.PI)diff+=Math.PI*2;game.pAngle+=diff*Math.min(1,dt*(game.pointerDown?12:8));}
else{game.pAngle+=((-Math.PI/2)-game.pAngle)*Math.min(1,dt*4);}

if(game.pulseCooldown>0)game.pulseCooldown=Math.max(0,game.pulseCooldown-dt);
const spawnRate=Math.max(.24,1.02-game.wave*.06);
game.spawnTimer-=dt;
if(game.spawnTimer<=0&&!game.boss&&game.waveEnemiesLeft>0){spawnWaveChunk();game.spawnTimer=Math.max(0,spawnRate*(.55+Math.random()*.9));}
if(!game.boss&&game.waveEnemiesLeft<=0&&game.enemies.length===0)spawnBoss();
if(game.bossWarning>0)game.bossWarning-=dt;

if((game.pointerDown||game.fireTouchActive)&&game.inputLockTimer<=0){
if(!game.holdArmed){game.autoFire-=dt;if(game.autoFire<=0){game.holdArmed=true;game.autoFire=0;}}
if(game.holdArmed){
game.autoFire-=dt;

if(game.autoFire<=0){const burst=game.energy>=100?2:1;for(let k=0;k<burst;k++)fireBullet(game.energy>=100?2:1);game.autoFire=fireGap;}
}
}

for(let i=game.bullets.length-1;i>=0;i--){
const b=game.bullets[i];b.trail.push({x:b.x,y:b.y});if(b.trail.length>6)b.trail.shift();
b.x+=b.vx;b.y+=b.vy;b.life-=dt*.95;

}

for(let i=game.enemies.length-1;i>=0;i--){

e.y+=e.speed*dt*e.fallAccel;e.rot+=e.spin*dt;

game.enemies.splice(i,1);spawnExplosion(game.baseX,game.baseY,'#ff445e',32,1.2);showToast('いたい','#ff445e');
game.combo=0;game.energy=Math.max(0,game.energy-18);game.lives--;game.flash=Math.max(game.flash,.28);game.flashColor='#ff445e';
playSound(95,'square',.22,.06,.4);if(game.lives<=0){gameOver();return;}
}
}
updateBoss(dt);if(game.state!=='play')return;
updateEnemyBullets(dt);if(game.state!=='play')return;

for(let i=game.enemies.length-1;i>=0;i--){

function drawEnemy(e){

case'diamond':ctx.beginPath();ctx.moveTo(0,-e.size);ctx.lineTo(e.size*.85,0);ctx.lineTo(0,e.size);ctx.lineTo(-e.size*.85,0);ctx.closePath();ctx.fill();break;

}

ctx.save();ctx.translate(-game.recoil*9,0);ctx.fillStyle=COLORS[game.phase];roundRectPath(ctx,16,-8,50,16,8);ctx.fill();ctx.fillStyle='rgba(255,255,255,.9)';roundRectPath(ctx,52,-5,12,10,4);ctx.fill();ctx.restore();
ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,11,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,255,255,.22)';roundRectPath(ctx,-30,12,60,18,9);ctx.fill();ctx.restore();
for(const b of game.bullets){

function showError(msg, context) {
const el = document.getElementById('errorOverlay');
if (!el) return;
el.style.display = 'block';
el.innerHTML += `<div>⚠ ${context}: ${msg}</div>`;
}

let last=performance.now();
function loop(now){
const dt=Math.min(0.033,(now-last)/1000);last=now;
if(game.state==='play'){
try { update(dt); } catch(e) {
const loc = e.stack ? e.stack.split('\n')[1] : '';
showError(e.message + ' | ' + loc, 'update');
}
}
try { draw(); } catch(e) {
const loc = e.stack ? e.stack.split('\n')[1] : '';
showError(e.message + ' | ' + loc, 'draw');
}
requestAnimationFrame(loop);
}

// ============================================================
// ★★★ Input設計 — iOS フリーズ根絶 ★★★
//
// フリーズの原因だったもの（全て削除・passiveに変更）:
// [削除] gesturestart passive:false + preventDefault → iOSシステムジェスチャーと競合
// [削除] window touchmove passive:false + preventDefault → 長押し中に毎フレームUIスレッドをブロック
// [変更] window touchend passive:false → passive:true に変更、preventDefault削除
//
// 代替手段: CSS touch-action:none を html,body,canvas,fire-btn に設定済み
// これだけでスクロール・ズームを完全防止できる（JSのpreventDefaultは不要）
// ============================================================

function handleTap(now){
if(now-game.lastTapAt<=320){firePulse();game.lastTapAt=0;}else game.lastTapAt=now;
}
function startFireInput(){
if(game.state!=='play'||game.inputLockTimer>0)return;
game.pointerDown=true;game.fireTouchActive=true;game.holdArmed=false;game.autoFire=game.holdDelay;fireBtn.classList.add('firing');
}
function stopFireInput(){
game.pointerDown=false;game.fireTouchActive=false;game.holdArmed=false;game.autoFire=0;game.activePointerId=null;game.fireTouchId=null;fireBtn.classList.remove('firing');
}
function cancelPointer(){if(!game)return;stopFireInput();game.lastTapAt=0;}

// fireBtn タッチ — passive:true でUIスレッドをブロックしない
fireBtn.addEventListener('touchstart', e=>{
if(game.state!=='play'||game.inputLockTimer>0)return;
if(game.fireTouchId!==null)return;
const t=e.changedTouches[0];if(!t)return;
game.fireTouchId=t.identifier;startFireInput();
}, {passive:true}); // ★ passive:true

// ★ window touchend: passive:true + preventDefaultなし + handleTap追加
window.addEventListener('touchend', e=>{
if(game.state!=='play')return;
const ended=Array.from(e.changedTouches).some(t=>t.identifier===game.fireTouchId);
if(!ended)return;
const wasHold=game.holdArmed;
stopFireInput();
if(!wasHold)handleTap(performance.now()); // ★ ダブルタップ検出
}, {passive:true}); // ★ passive:true = フリーズしない

// ★ window touchcancel: passive:true
window.addEventListener('touchcancel', e=>{
const ended=Array.from(e.changedTouches).some(t=>t.identifier===game.fireTouchId);
if(!ended)return;
stopFireInput();game.lastTapAt=0;
}, {passive:true});

// canvas pointer（PC/マウス向け）— passive:true
canvas.addEventListener('pointerdown', e=>{if(game.state!=='play'||e.pointerType==='touch')return;startFireInput();game.activePointerId=e.pointerId;try{canvas.setPointerCapture(e.pointerId);}catch(_){}},{passive:true});
canvas.addEventListener('pointerup', e=>{if(game.state!=='play'||e.pointerType==='touch')return;if(game.activePointerId!==null&&e.pointerId!==game.activePointerId)return;const wasHold=game.holdArmed;stopFireInput();if(!wasHold)handleTap(performance.now());try{canvas.releasePointerCapture(e.pointerId);}catch(_){}},{passive:true});
canvas.addEventListener('pointercancel', e=>{if(e.pointerType==='touch')return;stopFireInput();game.lastTapAt=0;},{passive:true});
canvas.addEventListener('contextmenu', e=>e.preventDefault());
canvas.addEventListener('lostpointercapture', cancelPointer,{passive:true});

// 色ボタン: touchstartのpreventDefaultで250msクリック遅延を防ぐ
// ★ これは長押し中ではなく一瞬なのでフリーズしない
blueBtn.addEventListener('touchstart', e=>{e.preventDefault();setPhase(0);},{passive:false});
pinkBtn.addEventListener('touchstart', e=>{e.preventDefault();setPhase(1);},{passive:false});
blueBtn.addEventListener('click', ()=>setPhase(0));
pinkBtn.addEventListener('click', ()=>setPhase(1));

// グローバルキャンセル — 全てpassive:true
window.addEventListener('blur', cancelPointer,{passive:true});
document.addEventListener('visibilitychange', ()=>{if(document.hidden)cancelPointer();},{passive:true});
document.addEventListener('selectstart', e=>e.preventDefault());

// ★ gesturestart → 削除（iOSシステムジェスチャーと競合してフリーズ）
// ★ touchmove passive:false + preventDefault → 削除（長押し中に毎フレームUIスレッドをブロック）
// → 両方 CSS touch-action:none で代替済み

startBtn.addEventListener('click', ()=>{try{getAudioCtx();}catch(_){}resetGame();});

game=makeGame();resize();initStars();updateBasePosition();updatePhaseText();updateHud();
subTitle.textContent=`BEST ${highScore.toLocaleString()}`;
requestAnimationFrame(loop);
})();
